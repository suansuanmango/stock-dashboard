<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>投資儀表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #0a0f1e; font-family: -apple-system, 'Segoe UI', sans-serif; overscroll-behavior: none; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .nav-btn { color: #475569; transition: color 0.2s; }
    .nav-btn.active { color: #60a5fa; }
    .card { background: #131c2e; border: 1px solid #1e2d45; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .gain { color: #4ade80; }
    .loss { color: #f87171; }
    .neutral { color: #64748b; }
    .badge { padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-gain { background: rgba(74,222,128,0.12); color: #4ade80; }
    .badge-loss { background: rgba(248,113,113,0.12); color: #f87171; }
    .badge-neutral { background: rgba(100,116,139,0.15); color: #94a3b8; }
    .divider { border-top: 1px solid #1e2d45; margin: 12px 0; }
    .label { font-size: 11px; color: #64748b; margin-bottom: 2px; }
    .market-btn { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: all 0.2s; }
    .market-btn.active { border: 2px solid #60a5fa; background: rgba(96,165,250,0.1); color: #60a5fa; }
    .market-btn.inactive { border: 1px solid #334155; background: transparent; color: #64748b; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { animation: spin 0.8s linear infinite; display: inline-block; }
  </style>
</head>
<body class="text-white min-h-screen">

  <!-- Header -->
  <div class="sticky top-0 z-20" style="background:rgba(10,15,30,0.95); backdrop-filter:blur(10px); border-bottom:1px solid #1e2d45;">
    <div class="flex justify-between items-center px-4 py-3">
      <div class="font-bold tracking-wide">📊 酸酸投資板</div>
      <div class="flex items-center gap-1">
        <div id="refresh-updated" class="text-xs" style="color:#60a5fa;display:none;"></div>
        <button id="refresh-btn" onclick="refreshLivePrices()" title="刷新即時股價"
          style="color:#60a5fa; font-size:18px; line-height:1; padding:4px 8px; border-radius:8px; background:rgba(96,165,250,0.12); border:1px solid rgba(96,165,250,0.25); cursor:pointer; transition:opacity 0.2s;">↻</button>
      </div>
    </div>
  </div>

  <!-- ───── 資產頁 ───── -->
  <div id="page-assets" class="tab-content active px-4 pt-4 pb-28">
    <div class="card" style="background:linear-gradient(135deg,#131c2e,#1a2540);">
      <div class="label">總資產（台幣）</div>
      <div id="total-value" class="text-4xl font-bold mt-1 mb-3">—</div>
      <div id="donut-chart-container"></div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <div class="label">今日損益</div>
          <div id="daily-pnl" class="text-sm font-semibold">—</div>
        </div>
        <div>
          <div class="label">累計損益</div>
          <div id="total-pnl" class="text-sm font-semibold">—</div>
        </div>
      </div>
      <div class="mt-2 text-xs" style="color:#334155;" id="exchange-rate"></div>
    </div>
    <div class="label px-1 mb-2 mt-2">持股明細</div>
    <div id="holdings-list"></div>
    <div id="deposits-section" style="display:none">
      <div class="label px-1 mb-2 mt-4">定存</div>
      <div id="deposits-list"></div>
    </div>
  </div>

  <!-- ───── 行情頁 ───── -->
  <div id="page-market" class="tab-content px-4 pt-4 pb-28">
    <div id="market-updated" class="label px-1 mb-3">—</div>
    <div class="label px-1 mb-2">🇹🇼 台股 / ETF</div>
    <div id="tw-list"></div>
    <div class="label px-1 mb-2 mt-5">🇺🇸 美股</div>
    <div id="us-list"></div>
    <div id="custom-section" style="display:none;">
      <div class="label px-1 mb-2 mt-5">⭐ 自訂追蹤</div>
      <div id="custom-list"></div>
    </div>
  </div>

  <!-- FAB 新增按鈕（僅行情頁顯示） -->
  <button id="fab-add" onclick="openAddModal()"
    style="display:none; position:fixed; bottom:82px; right:18px; width:48px; height:48px; background:#3b82f6; border-radius:50%; align-items:center; justify-content:center; z-index:15; box-shadow:0 4px 16px rgba(59,130,246,0.45);">
    <svg width="22" height="22" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <!-- 新增股票 Modal -->
  <div id="add-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50;" onclick="closeAddModal()">
    <div style="position:absolute; bottom:0; left:0; right:0; background:#131c2e; border-radius:20px 20px 0 0; padding:24px 20px 36px;" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center mb-5">
        <div class="font-bold text-base">新增觀察標的</div>
        <button onclick="closeAddModal()" style="color:#64748b; font-size:22px; line-height:1;">×</button>
      </div>
      <input id="ticker-input" type="text" placeholder="輸入股票代號（例：AAPL、2330）"
        style="width:100%; background:#0a0f1e; border:1px solid #2d3f5c; border-radius:10px; padding:13px 14px; color:white; font-size:16px; margin-bottom:14px; outline:none;"
        autocomplete="off" autocapitalize="characters"
        onkeydown="if(event.key==='Enter') addCustomStock()">
      <div class="flex gap-3 mb-5">
        <button id="btn-us" class="market-btn active" onclick="selectMarket('US')">🇺🇸 美股</button>
        <button id="btn-tw" class="market-btn inactive" onclick="selectMarket('TW')">🇹🇼 台股</button>
      </div>
      <button onclick="addCustomStock()"
        style="width:100%; padding:14px; background:#3b82f6; border-radius:12px; font-weight:bold; font-size:16px;">
        新增
      </button>
      <div id="add-error" style="color:#f87171; font-size:12px; text-align:center; margin-top:10px; min-height:16px;"></div>
    </div>
  </div>

  <!-- ───── 財經頁 ───── -->
  <div id="page-news" class="tab-content px-4 pt-4 pb-28">
    <div class="flex items-center gap-2 px-1 mb-3">
      <div id="news-updated" class="label">—</div>
      <div id="news-error" style="color:#f87171;font-size:11px;display:none;"></div>
    </div>
    <div id="news-container"></div>
  </div>

  <!-- ───── 交易頁 ───── -->
  <div id="page-trades" class="tab-content px-4 pt-4 pb-28">
    <div class="label px-1 mb-3">交易紀錄（最新在上）</div>
    <div id="trades-list"></div>
  </div>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 z-20" style="background:rgba(10,15,30,0.97); border-top:1px solid #1e2d45; padding-bottom:env(safe-area-inset-bottom);">
    <div class="grid grid-cols-4">
      <button class="nav-btn active py-3 flex flex-col items-center gap-0.5" onclick="switchTab('assets')" id="nav-assets">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 13h4v8H3zM10 9h4v12h-4zM17 5h4v16h-4z"/></svg>
        <span style="font-size:10px;">資產</span>
      </button>
      <button class="nav-btn py-3 flex flex-col items-center gap-0.5" onclick="switchTab('market')" id="nav-market">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span style="font-size:10px;">行情</span>
      </button>
      <button class="nav-btn py-3 flex flex-col items-center gap-0.5" onclick="switchTab('news')" id="nav-news">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span style="font-size:10px;">財經</span>
      </button>
      <button class="nav-btn py-3 flex flex-col items-center gap-0.5" onclick="switchTab('trades')" id="nav-trades">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span style="font-size:10px;">交易</span>
      </button>
    </div>
  </nav>

  <script>
    // ── global state ──────────────────────────────────
    let _portfolioData = null;
    let _newsData = null;

    // ── helpers ──────────────────────────────────────
    const fmt = (n, d=0) => n == null ? '—' : new Intl.NumberFormat('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
    const sign = (n, d=0) => n == null ? '—' : (n>=0?'+':'')+fmt(n,d);
    const cls = n => n == null ? 'neutral' : n>0 ? 'gain' : n<0 ? 'loss' : 'neutral';
    const badge = (n, unit='%', d=2) => {
      if (n == null) return '<span class="badge badge-neutral">—</span>';
      const c = n>0?'badge-gain':n<0?'badge-loss':'badge-neutral';
      return `<span class="badge ${c}">${n>=0?'+':''}${fmt(n,d)}${unit}</span>`;
    };
    const fmtTime = iso => {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    };

    // ── tab switching ─────────────────────────────────
    function toggleAI(id) {
      const el = document.getElementById(id);
      const arrow = document.getElementById(id+'-arrow');
      const open = el.style.display === 'none';
      el.style.display = open ? 'block' : 'none';
      arrow.style.transform = open ? 'rotate(180deg)' : '';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));
      document.getElementById('page-'+tab).classList.add('active');
      document.getElementById('nav-'+tab).classList.add('active');
      const fab = document.getElementById('fab-add');
      fab.style.display = tab === 'market' ? 'flex' : 'none';
    }

    // ── donut chart ───────────────────────────────────
    function renderDonut(holdings) {
      const colors = ['#60a5fa','#4ade80','#a78bfa','#fb923c','#f472b6'];
      const withValue = holdings.filter(h => h.current_value_twd != null && h.quantity);
      const total = withValue.reduce((s, h) => s + h.current_value_twd, 0);
      const container = document.getElementById('donut-chart-container');
      if (!total || !withValue.length) { container.innerHTML = ''; return; }

      let pct = 0;
      const items = withValue.map((h, i) => {
        const p = h.current_value_twd / total * 100;
        const color = colors[i % colors.length];
        const seg = { start: pct, end: pct + p, pct: Math.round(p), color, ticker: h.ticker, name: h.name };
        pct += p;
        return seg;
      });

      const gradient = items.map(s => `${s.color} ${s.start.toFixed(2)}% ${s.end.toFixed(2)}%`).join(', ');

      container.innerHTML = `
        <div style="display:flex;align-items:center;gap:20px;margin:14px 0 12px;">
          <div style="position:relative;width:96px;height:96px;flex-shrink:0;">
            <div style="width:96px;height:96px;border-radius:50%;background:conic-gradient(${gradient});"></div>
            <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:#131c2e;"></div>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
            ${items.map(s => `
              <div style="display:flex;align-items:center;gap:7px;">
                <div style="width:8px;height:8px;border-radius:50%;background:${s.color};flex-shrink:0;"></div>
                <span style="font-size:12px;color:#94a3b8;">${s.ticker}</span>
                <span style="font-size:12px;color:#64748b;margin-left:auto;">${s.pct}%</span>
              </div>`).join('')}
          </div>
        </div>`;
    }

    // ── render: assets ────────────────────────────────
    function renderAssets(p, n) {
      if (p.total_value_twd != null) {
        document.getElementById('total-value').innerHTML = `NT$ ${fmt(p.total_value_twd)}`;
      } else {
        document.getElementById('total-value').innerHTML = '<span class="neutral text-2xl">等待資料更新</span>';
      }
      document.getElementById('daily-pnl').innerHTML = p.daily_gain_loss_twd != null
        ? `<span class="${cls(p.daily_gain_loss_twd)}">${sign(p.daily_gain_loss_twd,0)} TWD</span> ${badge(p.daily_gain_loss_pct)}`
        : '<span class="neutral">—</span>';
      document.getElementById('total-pnl').innerHTML = p.total_gain_loss_twd != null
        ? `<span class="${cls(p.total_gain_loss_twd)}">${sign(p.total_gain_loss_twd,0)} TWD</span> ${badge(p.total_gain_loss_pct)}`
        : '<span class="neutral">—</span>';
      if (p.exchange_rate_usd_twd) document.getElementById('exchange-rate').textContent = `USD/TWD ${p.exchange_rate_usd_twd}`;
      const list = document.getElementById('holdings-list');
      list.innerHTML = '';
      const twHoldings = (p.holdings||[]).filter(h => h.market === 'TW');
      const usHoldings = (p.holdings||[]).filter(h => h.market === 'US');
      const aiMap = {};
      ((n||{}).ai_analysis||[]).forEach(a => { aiMap[a.ticker] = a; });
      const dirStyle = d => {
        if (d==='可布局') return 'background:rgba(34,197,94,0.15);color:#22c55e;border:1px solid rgba(34,197,94,0.25);';
        if (d==='減碼')   return 'background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.25);';
        return 'background:rgba(245,158,11,0.15);color:#f59e0b;border:1px solid rgba(245,158,11,0.25);';
      };
      const holdingCard = h => {
        const priceStr = h.current_price != null ? (h.currency==='TWD'?'NT$ ':'$ ')+fmt(h.current_price,2) : '—';
        const hasPos = h.quantity && h.avg_price;
        const ai = aiMap[h.ticker];
        const aid = 'ai-'+h.ticker;
        const aiSection = ai ? `
          <div class="divider"></div>
          <div onclick="toggleAI('${aid}')" style="display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;">
            <span style="font-size:10px;padding:2px 8px;border-radius:4px;${dirStyle(ai.direction)}">${ai.direction}</span>
            <span style="font-size:11px;color:#64748b;flex:1;">${ai.timeframe}</span>
            <svg id="${aid}-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.25s;flex-shrink:0;"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div id="${aid}" style="display:none;margin-top:8px;font-size:11px;color:#475569;line-height:1.7;border-left:2px solid #1e293b;padding-left:10px;">
            ${ai.reasoning}
            <div style="margin-top:6px;color:#334155;">📎 ${(ai.sources||[]).join('・')}</div>
          </div>` : '';
        return `
          <div class="card">
            <div class="flex justify-between items-start">
              <div><div class="font-semibold text-sm">${h.name}</div><div style="font-size:11px;color:#475569;">${h.ticker}</div></div>
              <div class="text-right"><div class="font-mono font-bold text-sm">${priceStr}</div><div class="mt-0.5">${badge(h.price_change_pct)}</div></div>
            </div>
            ${hasPos ? `
            <div class="divider"></div>
            <div class="grid grid-cols-3 gap-2">
              <div><div class="label">持股數</div><div class="font-mono text-sm">${fmt(h.quantity)}</div></div>
              <div><div class="label">現值 (NT$)</div><div class="font-mono text-sm">${h.current_value_twd!=null?fmt(h.current_value_twd):'—'}</div></div>
              <div><div class="label">損益</div><div class="font-mono text-sm ${cls(h.gain_loss_twd)}">${h.gain_loss_twd!=null?sign(h.gain_loss_twd,0):'—'}</div></div>
            </div>
            <div class="mt-2 text-right">${badge(h.gain_loss_pct)}</div>
            ${aiSection}
            ` : `<div class="divider"></div><div style="font-size:11px;color:#475569;">⚠️ 待補入持股數量與均價</div>`}
          </div>`;
      };
      renderDonut(p.holdings || []);
      if (twHoldings.length) {
        list.innerHTML += `<div class="label px-1 mb-2">🇹🇼 台股 / ETF</div>`;
        twHoldings.forEach(h => list.innerHTML += holdingCard(h));
      }
      if (usHoldings.length) {
        list.innerHTML += `<div class="label px-1 mb-2 ${twHoldings.length?'mt-4':''}">🇺🇸 美股</div>`;
        usHoldings.forEach(h => list.innerHTML += holdingCard(h));
      }
      const deps = p.deposits||[];
      if (deps.length > 0) {
        document.getElementById('deposits-section').style.display='block';
        document.getElementById('deposits-list').innerHTML = deps.map(d=>`
          <div class="card">
            <div class="flex justify-between items-center">
              <div><div class="font-semibold text-sm">${d.bank} 定存</div><div style="font-size:11px;color:#475569;">${d.start_date} 起・年利率 ${d.rate}%</div></div>
              <div class="font-mono font-bold text-sm">NT$ ${fmt(d.amount)}</div>
            </div>
          </div>`).join('');
      }
    }

    // ── render: market (JSON stocks) ──────────────────
    function renderMarket(w) {
      document.getElementById('market-updated').textContent = w.last_updated ? '股價更新 '+fmtTime(w.last_updated) : '尚未更新';
      const twEl = document.getElementById('tw-list');
      const usEl = document.getElementById('us-list');
      twEl.innerHTML = '';
      usEl.innerHTML = '';
      (w.stocks||[]).forEach(s => {
        const priceStr = s.current_price != null ? (s.market==='TW'?'NT$ ':'$ ')+fmt(s.current_price,2) : '—';
        const el = `
          <div class="card" style="padding:12px 16px; margin-bottom:8px;">
            <div class="flex justify-between items-center">
              <div><span class="font-semibold text-sm">${s.name}</span><span style="font-size:11px;color:#475569;margin-left:6px;">${s.ticker}</span></div>
              <div class="text-right"><div class="font-mono font-bold text-sm">${priceStr}</div><div class="mt-0.5">${badge(s.change_pct)}</div></div>
            </div>
          </div>`;
        (s.market==='TW'?twEl:usEl).innerHTML += el;
      });
      renderCustomStocks();
    }

    // ── custom watchlist (localStorage) ──────────────
    let _selectedMarket = 'US';

    function getCustomStocks() {
      return JSON.parse(localStorage.getItem('custom_watchlist') || '[]');
    }
    function saveCustomStocks(arr) {
      localStorage.setItem('custom_watchlist', JSON.stringify(arr));
    }

    async function fetchLivePrice(ticker, market) {
      const symbol = market === 'TW' ? ticker + '.TW' : ticker;
      const target = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=5d`;
      const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(target)}`;
      try {
        const res = await fetch(proxy, { signal: AbortSignal.timeout(9000) });
        const data = await res.json();
        const parsed = JSON.parse(data.contents);
        const closes = parsed.chart.result[0].indicators.quote[0].close.filter(v => v != null);
        if (!closes.length) return { p: null, c: null };
        const cur = closes[closes.length - 1];
        const prev = closes.length >= 2 ? closes[closes.length - 2] : cur;
        return {
          p: Math.round(cur * 100) / 100,
          c: prev ? Math.round((cur - prev) / prev * 10000) / 100 : 0
        };
      } catch(e) {
        return { p: null, c: null };
      }
    }

    async function renderCustomStocks() {
      const customs = getCustomStocks();
      const section = document.getElementById('custom-section');
      const list = document.getElementById('custom-list');
      if (!customs.length) { section.style.display = 'none'; return; }
      section.style.display = 'block';
      // show loading skeletons first
      list.innerHTML = customs.map(s => `
        <div class="card" style="padding:12px 16px; margin-bottom:8px;" id="custom-${s.ticker}">
          <div class="flex justify-between items-center">
            <div>
              <span class="font-semibold text-sm">${s.ticker}</span>
              <span style="font-size:11px;color:#475569;margin-left:6px;">${s.market==='TW'?'台股':'美股'}</span>
            </div>
            <div class="flex items-center gap-3">
              <div class="text-right">
                <div class="font-mono font-bold text-sm" id="p-${s.ticker}" style="color:#64748b;">抓取中…</div>
              </div>
              <button onclick="removeCustomStock('${s.ticker}')" style="color:#475569; font-size:18px; line-height:1; padding:2px 4px;">×</button>
            </div>
          </div>
        </div>`).join('');
      // fetch prices in parallel
      customs.forEach(async s => {
        const { p, c } = await fetchLivePrice(s.ticker, s.market);
        const el = document.getElementById(`p-${s.ticker}`);
        if (!el) return;
        const priceStr = p != null ? (s.market==='TW'?'NT$ ':'$ ')+fmt(p,2) : '—';
        el.closest('.card').querySelector('.flex').innerHTML = `
          <div><span class="font-semibold text-sm">${s.ticker}</span><span style="font-size:11px;color:#475569;margin-left:6px;">${s.market==='TW'?'台股':'美股'}</span></div>
          <div class="flex items-center gap-3">
            <div class="text-right">
              <div class="font-mono font-bold text-sm">${priceStr}</div>
              <div class="mt-0.5">${badge(c)}</div>
            </div>
            <button onclick="removeCustomStock('${s.ticker}')" style="color:#475569; font-size:18px; line-height:1; padding:2px 4px;">×</button>
          </div>`;
      });
    }

    function removeCustomStock(ticker) {
      saveCustomStocks(getCustomStocks().filter(s => s.ticker !== ticker));
      renderCustomStocks();
    }

    // ── modal ─────────────────────────────────────────
    function openAddModal() {
      document.getElementById('add-modal').style.display = 'block';
      document.getElementById('ticker-input').value = '';
      document.getElementById('add-error').textContent = '';
      selectMarket('US');
      setTimeout(() => document.getElementById('ticker-input').focus(), 100);
    }
    function closeAddModal() {
      document.getElementById('add-modal').style.display = 'none';
    }
    function selectMarket(m) {
      _selectedMarket = m;
      document.getElementById('btn-us').className = 'market-btn ' + (m==='US'?'active':'inactive');
      document.getElementById('btn-tw').className = 'market-btn ' + (m==='TW'?'active':'inactive');
    }
    async function addCustomStock() {
      const ticker = document.getElementById('ticker-input').value.trim().toUpperCase();
      const errEl = document.getElementById('add-error');
      if (!ticker) { errEl.textContent = '請輸入股票代號'; return; }
      const customs = getCustomStocks();
      if (customs.find(s => s.ticker === ticker)) { errEl.textContent = '已在清單中'; return; }
      errEl.textContent = '';
      customs.push({ ticker, market: _selectedMarket });
      saveCustomStocks(customs);
      closeAddModal();
      renderCustomStocks();
    }

    // ── render: news ──────────────────────────────────
    function renderNews(n) {
      document.getElementById('news-updated').textContent = n.last_updated ? '自動更新時間 '+fmtTime(n.last_updated) : '尚未更新（等待每日排程）';
      const errEl = document.getElementById('news-error');
      if (n.error) { errEl.textContent = '⚠ ' + n.error; errEl.style.display = 'inline'; }
      else { errEl.style.display = 'none'; }
      const c = document.getElementById('news-container');
      if (!n.summary && !(n.articles||[]).length) {
        c.innerHTML = `
          <div class="card text-center py-10">
            <div style="font-size:40px;margin-bottom:10px;">📰</div>
            <div style="color:#475569;">財經摘要每日早上自動更新</div>
            <div style="color:#334155;font-size:11px;margin-top:6px;">來源：股癌・財報狗・股感・財經M平方</div>
          </div>`;
        return;
      }
      let html = '';
      if (n.summary) html += `<div class="card mb-3"><div style="font-size:12px;color:#94a3b8;">${n.summary}</div></div>`;

      // 選股雷達
      if ((n.stock_radar||[]).length) {
        const dirS = d => d==='值得關注'
          ? 'background:rgba(96,165,250,0.15);color:#60a5fa;border:1px solid rgba(96,165,250,0.25);'
          : 'background:rgba(245,158,11,0.15);color:#f59e0b;border:1px solid rgba(245,158,11,0.25);';
        let rhtml = `<div class="card mb-3">
          <div style="font-size:13px;font-weight:700;color:#f8fafc;margin-bottom:4px;">🔍 選股雷達</div>
          <div style="font-size:11px;color:#475569;margin-bottom:12px;">KOL 近期提及・美股優先・排除現有持股</div>`;
        n.stock_radar.forEach((item, i) => {
          rhtml += `
            <div style="${i>0?'border-top:1px solid #1e293b;padding-top:12px;margin-top:12px;':''}">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;">
                <span style="font-weight:700;font-size:13px;">${item.ticker}</span>
                <span style="font-size:11px;color:#64748b;">${item.name}</span>
                <span style="font-size:10px;padding:2px 7px;border-radius:4px;${dirS(item.direction)}">${item.direction}</span>
                <span style="font-size:11px;color:#475569;margin-left:auto;">${item.market==='TW'?'🇹🇼':'🇺🇸'}</span>
              </div>
              <div style="font-size:11px;color:#64748b;margin-bottom:4px;">${item.timeframe}</div>
              <div style="font-size:12px;color:#94a3b8;line-height:1.7;">${item.reasoning}</div>
              <div style="font-size:11px;color:#475569;margin-top:6px;">📎 ${(item.sources||[]).join('・')}</div>
            </div>`;
        });
        rhtml += `<div style="font-size:10px;color:#334155;margin-top:14px;border-top:1px solid #1e293b;padding-top:8px;">⚠️ 以上為 AI 整理 KOL 觀點，非投資建議</div></div>`;
        html += rhtml;
      }

      (n.articles||[]).forEach(a => {
        html += `
          <div class="card mb-3">
            <div style="font-size:11px;color:#60a5fa;margin-bottom:4px;">${a.source}</div>
            <div class="font-semibold text-sm mb-2">${a.title}</div>
            <div class="text-sm leading-relaxed" style="color:#94a3b8;">${a.summary}</div>
          </div>`;
      });
      c.innerHTML = html;
    }

    // ── render: trades ────────────────────────────────
    function renderTrades(t) {
      const list = document.getElementById('trades-list');
      const trades = [...(t.trades||[])].reverse();
      if (!trades.length) {
        list.innerHTML = `
          <div class="card text-center py-10">
            <div style="font-size:40px;margin-bottom:10px;">🗒️</div>
            <div style="color:#475569;">尚無交易紀錄</div>
            <div style="color:#334155;font-size:11px;margin-top:6px;">和 Claude 討論決定買入後自動記錄</div>
          </div>`;
        return;
      }
      list.innerHTML = trades.map(tr => `
        <div class="card mb-3">
          <div class="flex justify-between items-start mb-3">
            <div><div class="font-semibold text-sm">${tr.name||tr.ticker}</div><div style="font-size:11px;color:#475569;">${tr.ticker}</div></div>
            <div style="font-size:11px;color:#475569;">${tr.date}</div>
          </div>
          <div class="grid grid-cols-2 gap-3 mb-3">
            <div><div class="label">成交數量</div><div class="font-mono text-sm">${fmt(tr.quantity)} 股</div></div>
            <div><div class="label">成交價</div><div class="font-mono text-sm">${tr.currency==='USD'?'$ ':'NT$ '}${fmt(tr.price,2)}</div></div>
          </div>
          ${tr.reason?`<div class="divider"></div><div class="label">買入原因</div><div style="font-size:12px;color:#94a3b8;line-height:1.6;">${tr.reason}</div>`:''}
          ${tr.notes?`<div class="mt-2"><div class="label">備註</div><div style="font-size:12px;color:#64748b;line-height:1.6;">${tr.notes}</div></div>`:''}
        </div>`).join('');
    }

    // ── live price refresh ────────────────────────────
    async function refreshLivePrices() {
      if (!_portfolioData) return;
      const btn = document.getElementById('refresh-btn');
      btn.classList.add('spinning');
      btn.style.pointerEvents = 'none';

      try {
      const holdings = _portfolioData.holdings || [];
      const exRate = _portfolioData.exchange_rate_usd_twd || 31;

      const results = await Promise.race([
        Promise.all(holdings.map(h => fetchLivePrice(h.ticker, h.market))),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000))
      ]);

      const updated = { ..._portfolioData };
      updated.holdings = holdings.map((h, i) => {
        const { p, c } = results[i];
        if (p == null) return h;
        const newH = { ...h, current_price: p, price_change_pct: c };
        if (h.quantity && h.avg_price) {
          const valueLocal = p * h.quantity;
          const costLocal = h.avg_price * h.quantity;
          const rate = h.market === 'US' ? exRate : 1;
          newH.current_value_twd = Math.round(valueLocal * rate);
          const costTwd = Math.round(costLocal * rate);
          newH.gain_loss_twd = newH.current_value_twd - costTwd;
          newH.gain_loss_pct = Math.round((p - h.avg_price) / h.avg_price * 10000) / 100;
          if (c != null) {
            const prevPrice = p / (1 + c / 100);
            newH.daily_gain_loss_twd = Math.round((p - prevPrice) * h.quantity * rate);
            newH.daily_gain_loss_pct = c;
          }
        }
        return newH;
      });

      const withValue = updated.holdings.filter(h => h.current_value_twd != null);
      if (withValue.length) {
        updated.total_value_twd = withValue.reduce((s, h) => s + h.current_value_twd, 0);
        const totalDaily = withValue.reduce((s, h) => s + (h.daily_gain_loss_twd || 0), 0);
        updated.daily_gain_loss_twd = totalDaily;
        updated.daily_gain_loss_pct = updated.total_value_twd
          ? Math.round(totalDaily / (updated.total_value_twd - totalDaily) * 10000) / 100 : 0;
        const totalGain = withValue.reduce((s, h) => s + (h.gain_loss_twd || 0), 0);
        updated.total_gain_loss_twd = totalGain;
        const exR = updated.exchange_rate_usd_twd || 31;
        const totalCost = withValue.reduce((s, h) => {
          if (!h.quantity || !h.avg_price) return s;
          return s + Math.round(h.avg_price * h.quantity * (h.market === 'US' ? exR : 1));
        }, 0);
        updated.total_gain_loss_pct = totalCost ? Math.round(totalGain / totalCost * 10000) / 100 : null;
      }

      updated.last_updated = new Date().toISOString();
      _portfolioData = updated;
      renderAssets(updated, _newsData);

      const el = document.getElementById('refresh-updated');
      el.textContent = '股價更新 ' + fmtTime(updated.last_updated);
      el.style.display = 'block';

      } catch(e) {
        console.warn('refreshLivePrices error:', e);
      } finally {
        btn.classList.remove('spinning');
        btn.style.pointerEvents = 'auto';
      }
    }

    // ── main load ─────────────────────────────────────
    async function loadData() {
      const ts = '?t='+Date.now();
      try {
        const [p,w,n,t] = await Promise.all([
          fetch('data/portfolio.json'+ts).then(r=>r.json()),
          fetch('data/watchlist.json'+ts).then(r=>r.json()),
          fetch('data/news.json'+ts).then(r=>r.json()),
          fetch('data/trades.json'+ts).then(r=>r.json()),
        ]);
        _portfolioData = p;
        _newsData = n;
        renderAssets(p, n);
        renderMarket(w);
        renderNews(n);
        renderTrades(t);
      } catch(e) {
        console.error(e);
      }
    }

    loadData();
  </script>
</body>
</html>
